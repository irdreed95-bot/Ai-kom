name: Expire inactive Ai-kom project memory
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expire-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Expire inactive project memory
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          MEMORY_CLEANUP_SECRET: ${{ secrets.MEMORY_CLEANUP_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$MEMORY_CLEANUP_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST "$SUPABASE_URL/functions/v1/expire-memory" \
            --header "Authorization: Bearer $MEMORY_CLEANUP_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}'
